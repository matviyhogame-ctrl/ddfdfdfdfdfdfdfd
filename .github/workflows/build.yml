name: Build PastaClient JAR

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "7.6.4"
          cache-disabled: true

      - name: Make gradlew executable (if present)
        run: |
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
          fi

      - name: Build mod JAR
        run: |
          if [ -f ./gradlew ]; then
            ./gradlew build --no-daemon
          else
            gradle build --no-daemon
          fi

      - name: Upload built JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: pastaclient-jar
          path: build/libs/*.jar
          if-no-files-found: error
